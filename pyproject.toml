[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "diplom_3"
version = "1.0.0"
description = "UI tests for qa-stellarburgers.education-services.ru"
requires-python = ">=3.10"
dependencies = [
    "pytest>=7.4",
    "selenium>=4.15",
    "allure-pytest>=2.13",
    "faker>=20.0",
]

[tool.pytest.ini_options]
markers = [
    "password_recovery: тесты восстановления пароля",
    "personal_account: тесты личного кабинета",
    "main_functional: тесты основного функционала",
]
addopts = "-v --alluredir=allure-results"
log_cli = true
log_cli_level = "WARNING"
log_cli_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
log_file = "pytest.log"
log_file_level = "WARNING"
log_file_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_file_date_format = "%Y-%m-%d %H:%M:%S"

[tool.allure]
report_dir = "allure-report"
clean = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501", "N812"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = false
